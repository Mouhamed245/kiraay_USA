<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}Administration{% endblock %} – Kiiraay America</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="adm">
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{ url_for('admin_dashboard') }}">KIIRAAY <span>ADMIN</span></a>
    {% if session.admin %}
    <nav>
      <a href="{{ url_for('admin_dashboard') }}">Demandes</a>
      <a href="{{ url_for('admin_posts') }}">Publications</a>
      <a href="{{ url_for('admin_gallery') }}">Galerie</a>
      <a href="{{ url_for('admin_settings') }}">Textes et photo</a>
      <a href="{{ url_for('index') }}" target="_blank" rel="noopener">Voir le site</a>
      <form class="inline" method="POST" action="{{ url_for('admin_logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="link" type="submit">Déconnexion</button>
      </form>
    </nav>
    {% endif %}
  </div>
</header>
<main class="wrap adm-main">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
