{% extends "admin/base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="formbox login">
  <h2>Connexion administrateur</h2>
  <form method="POST" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div><label for="username">Utilisateur</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
    <div><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
